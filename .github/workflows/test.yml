name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Decrypt fixtures
        env:
          FIXTURES_PASSWORD: ${{ secrets.FIXTURES_PASSWORD }}
        run: scripts/fixtures.sh decrypt

      - uses: astral-sh/setup-uv@v10.3.0  # this action publishes exact versions only (no moving v10 tag)
        with:
          working-directory: backend
          enable-cache: true

      - name: Grader matches Otter's results (acceptance test 1)
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Decrypt fixtures
        env:
          FIXTURES_PASSWORD: ${{ secrets.FIXTURES_PASSWORD }}
        run: scripts/fixtures.sh decrypt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install test tools
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser tests (acceptance test 2 + Drive and flags)
        working-directory: frontend
        run: npm run test:e2e

      # No report/trace upload on purpose: traces and screenshots show hidden-test code, and
      # artifacts of a public repo are downloadable by anyone. Re-run failures locally instead.

  # Publishes the site only from main, and only after both test jobs passed.
  # Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
  deploy:
    name: Deploy to GitHub Pages
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # Fresh checkout, fixtures never decrypted here: only the site's own files are published.
      - name: Collect the site files
        run: scripts/collect-site.sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
